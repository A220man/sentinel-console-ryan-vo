version: '3.8'

services:
  # PostgreSQL for production (SQLite for dev)
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: sentinel
  #     POSTGRES_USER: sentinel
  #     POSTGRES_PASSWORD: ${DB_PASSWORD}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U sentinel"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Keycloak for OIDC authentication
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USER: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DATABASE_URL=sqlite:///./sentinel.db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-in-production}
      - OIDC_ENABLED=false
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/sentinel
      - OIDC_CLIENT_ID=sentinel-console
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:5173/callback
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=openai-compatible
      - LLM_MODEL=gpt-4o-mini
      - LLM_BASE_URL=${LLM_BASE_URL}
      - DEMO_MODE=true
      - DEBUG=true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - sentinel_db:/app
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sentinel_db:
  keycloak_data:
  # postgres_data:

networks:
  default:
    name: sentinel-network